<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Escolher Música</title>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 15px;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .video {
      display: flex;
      gap: 10px;
      background: #1e1e1e;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 6px;
      align-items: center;
    }

    .video img {
      width: 120px;
      border-radius: 4px;
    }

    .video-info {
      flex: 1;
    }

    .video-info h4 {
      margin: 0 0 6px 0;
      font-size: 14px;
    }

    .video-info p {
      margin: 0;
      font-size: 12px;
      color: #ccc;
    }
  </style>
</head>

<body>

<h2>🎤 Escolha sua música</h2>

<input id="search" placeholder="Digite a música que quer cantar">
<button onclick="buscar()">Buscar</button>

<div id="results"></div>

<script>
  const socket = io();

  const name = localStorage.getItem("guestName");
  const partyId = localStorage.getItem("partyId");

  if (!name || !partyId) {
    alert("Sessão inválida. Entre novamente na festa.");
    window.location.href = "/join.html";
  }

  socket.emit("joinParty", partyId);

  async function buscar() {
    const term = document.getElementById("search").value.trim();
    if (!term) return;

    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "🔍 Buscando músicas...";

    try {
      const response = await fetch(`/api/search?q=${encodeURIComponent(term)}`);
      const videos = await response.json();

      resultsDiv.innerHTML = "";

      videos.forEach(video => {
        const div = document.createElement("div");
        div.className = "video";

        div.innerHTML = `
          <img src="${video.thumbnail}">
          <div class="video-info">
            <h4>${video.title}</h4>
            <p>${video.channel}</p>
            <button>➕ Reservar</button>
          </div>
        `;

        div.querySelector("button").onclick = () => reservar(video);

        resultsDiv.appendChild(div);
      });

    } catch (err) {
      resultsDiv.innerHTML = "❌ Erro ao buscar músicas";
      console.error(err);
    }
  }

  function reservar(video) {
    socket.emit("addSong", {
      partyId,
      videoId: video.videoId,
      title: video.title,
      singer: name,
      thumbnail: video.thumbnail
    });

    alert("🎶 Música adicionada à fila!");
  }
</script>

</body>
</html>
