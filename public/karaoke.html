<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Escolher Música</title>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    input {
      width: 80%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>🎤 Escolha sua música</h2>

<input
  id="song"
  placeholder="Cole o link do YouTube"
/>
<br>
<button id="addBtn">Adicionar à fila</button>

<script>
  const socket = io();

  const name = localStorage.getItem("guestName");
  const partyId = localStorage.getItem("partyId");

  if (!name || !partyId) {
    alert("Sessão inválida. Entre novamente na festa.");
    window.location.href = "/join.html";
  }

  socket.emit("joinParty", partyId);

  function extractVideoId(url) {
    const regExp =
      /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return match && match[2].length === 11 ? match[2] : null;
  }

  document.getElementById("addBtn").addEventListener("click", () => {
    const input = document.getElementById("song").value.trim();
    if (!input) {
      alert("Cole o link do YouTube");
      return;
    }

    const videoId = extractVideoId(input);
    if (!videoId) {
      alert("Link do YouTube inválido");
      return;
    }

    socket.emit("addSong", {
      partyId,
      videoId,
      title: "Karaokê",
      singer: name,
      thumbnail: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
    });

    alert("🎶 Música adicionada à fila!");
    document.getElementById("song").value = "";
  });
</script>

</body>
</html>
