<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Escolher Música</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/base.css">
<script src="/socket.io/socket.io.js"></script>
</head>

<body>
<div class="container">
  <div class="card">

    <h2>🎶 Escolha sua música</h2>
    <p>Busque um karaokê e entre na fila</p>

    <input id="search" placeholder="Ex: Evidências, Legião Urbana...">
    <button onclick="search()">Buscar</button>

    <div id="results"></div>

  </div>
</div>

<script>
const socket = io();
const guest = localStorage.getItem("guestName");
const partyId = localStorage.getItem("partyId");

if (!guest || !partyId) {
  alert("Sessão inválida, entre novamente na festa");
  window.location.href = "/join.html";
}

socket.emit("joinParty", partyId);

async function search() {
  const q = document.getElementById("search").value;
  if (!q) return;

  const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
  const videos = await res.json();

  const list = document.getElementById("results");
  list.innerHTML = "";

  videos.forEach(v => {
    const card = document.createElement("div");
    card.className = "video-card";

    const thumb = document.createElement("div");
    thumb.className = "video-thumb";
    thumb.style.backgroundImage = `url(${v.thumbnail})`;

    const info = document.createElement("div");
    info.className = "video-info";

    const title = document.createElement("strong");
    title.innerText = v.title;

    const channel = document.createElement("small");
    channel.innerText = v.channel;

    const btn = document.createElement("button");
    btn.className = "secondary";
    btn.innerText = "🎤 Cantar essa";

   btn.addEventListener("click", () => {
  socket.emit("addSong", {
    partyId,
    videoId: v.videoId,
    title: v.title,
    singer: guest,
    thumbnail: v.thumbnail
  });

  alert("🎉 Música adicionada à fila!");
});


    info.appendChild(title);
    info.appendChild(channel);
    info.appendChild(btn);

    card.appendChild(thumb);
    card.appendChild(info);

    list.appendChild(card);
  });
}

</script>
</body>
</html>
