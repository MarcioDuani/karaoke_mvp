<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Entrar na Festa</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/base.css">
</head>

<body>
<div class="container">
  <div class="card">
    <h1>🎤 Bem-vindo</h1>
    <p>Digite seu nome para entrar na festa</p>

    <input id="name" placeholder="Seu nome">

    <button onclick="enter()">Entrar na Festa</button>
  </div>
</div>

<script>
function enter() {
  const name = document.getElementById("name").value.trim();
  const party = new URLSearchParams(location.search).get("party");

  if (!name || !party) {
    alert("Nome ou festa inválidos");
    return;
  }

  localStorage.setItem("guestName", name);
  localStorage.setItem("partyId", party);

  window.location.href = "/karaoke.html";
}
</script>
</body>
</html>
