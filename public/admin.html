<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Karaokê – Admin</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

#player-container {
  width: 80%;
  height: 450px;
  margin: 20px auto;
  background: #000;
  position: relative;
}

#startOverlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

#startBtn {
  font-size: 32px;
  padding: 20px 40px;
  border-radius: 10px;
  cursor: pointer;
}

ul {
  list-style: none;
  padding: 0;
  width: 80%;
  margin: auto;
  text-align: left;
}
li {
  padding: 10px;
  border-bottom: 1px solid #333;
}
</style>
</head>

<body>

<h1>🎤 Karaokê – Admin</h1>

<div id="player-container">
  <div id="startOverlay">
    <button id="startBtn">▶ Iniciar Festa</button>
  </div>
  <div id="player"></div>
</div>

<button onclick="nextSong()">⏭ Próxima música</button>

<h2>🎵 Fila</h2>
<ul id="queue"></ul>

<script>
const socket = io();
const partyId = new URLSearchParams(location.search).get("party");

socket.emit("joinParty", partyId);

let player;
let playerReady = false;
let currentVideoId = null;
let hasUserStarted = false;

// YouTube API
function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    width: "100%",
    height: "100%",
    playerVars: { controls: 1 },
    events: {
      onReady: () => playerReady = true,
      onStateChange: onPlayerStateChange
    }
  });
}

function playVideo(videoId) {
  if (!playerReady) return;
  if (videoId === currentVideoId) return;

  currentVideoId = videoId;
  player.loadVideoById(videoId);

  if (hasUserStarted) {
    player.playVideo();
  } else {
    player.pauseVideo();
  }
}

function onPlayerStateChange(e) {
  if (e.data === YT.PlayerState.PLAYING) {
    hasUserStarted = true;
  }
  if (e.data === YT.PlayerState.ENDED) {
    nextSong();
  }
}

// Overlay botão
document.getElementById("startBtn").onclick = () => {
  hasUserStarted = true;
  player.playVideo();
  document.getElementById("startOverlay").style.display = "none";
};

// Fila
socket.on("queueUpdate", queue => {
  const ul = document.getElementById("queue");
  ul.innerHTML = "";

  if (queue.length > 0) {
    playVideo(queue[0].videoId);
  }

  queue.forEach((q, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<strong>${i+1}.</strong> ${q.title}<br>🎤 ${q.singer}`;
    ul.appendChild(li);
  });
});

function nextSong() {
  socket.emit("nextSong", partyId);
}
</script>

</body>
</html>
