<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Karaokê – Duani Art'S</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
:root {
  --bg: #0f0f0f;
  --card: #1c1c1c;
  --accent: #ff2d55;
  --text: #ffffff;
  --muted: #aaaaaa;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 28px;
  font-weight: bold;
}

.main {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
  padding: 20px;
}

/* PLAYER */
.player-card {
  background: var(--card);
  border-radius: 16px;
  padding: 15px;
  position: relative;
}

#player {
  width: 100%;
  height: 420px;
  border-radius: 12px;
}

/* OVERLAY */
#startOverlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

#startBtn {
  font-size: 32px;
  padding: 18px 42px;
  border-radius: 50px;
  border: none;
  cursor: pointer;
  background: var(--accent);
  color: white;
}

/* AGORA TOCANDO */
.now-playing {
  margin-top: 15px;
  text-align: center;
}

.now-playing h2 { margin: 6px 0; }
.now-playing p { margin: 0; color: var(--muted); }

/* FILA */
.queue-card {
  background: var(--card);
  border-radius: 16px;
  padding: 15px;
  display: flex;
  flex-direction: column;
  max-height: 650px;
}

.queue-card h3 {
  margin-top: 0;
  text-align: center;
}

/* SCROLL */
.queue-list {
  overflow-y: auto;
  padding-right: 6px;
}

/* ITEM */
.queue-item {
  display: flex;
  gap: 12px;
  padding: 10px;
  border-bottom: 1px solid #333;
}

.queue-thumb {
  width: 120px;
  height: 68px;
  border-radius: 8px;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}

.queue-info {
  flex: 1;
}

.queue-info strong {
  display: block;
  font-size: 15px;
}

.queue-info small {
  color: var(--muted);
}

/* CONTROLES */
.controls {
  text-align: center;
  margin-top: 10px;
}

.controls button {
  padding: 14px 26px;
  font-size: 18px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  background: var(--accent);
  color: white;
}
</style>
</head>

<body>

<header>🎤 Karaokê – Duani Art'S</header>

<div class="main">

  <!-- PLAYER -->
  <div class="player-card">
    <div id="startOverlay">
      <button id="startBtn">▶ Iniciar Festa</button>
    </div>

    <div id="player"></div>

    <div class="now-playing">
      <h2 id="nowTitle">Aguardando música…</h2>
      <p id="nowSinger"></p>
    </div>
  </div>

  <!-- FILA -->
  <div class="queue-card">
    <h3>🎵 Fila</h3>

    <div class="queue-list" id="queue"></div>

    <div class="controls">
      <button onclick="nextSong()">⏭ Próxima</button>
    </div>
  </div>

</div>

<script>
const socket = io();
const partyId = new URLSearchParams(location.search).get("party");

if (!partyId) {
  alert("Festa não informada");
  throw new Error("partyId ausente");
}

socket.emit("joinParty", partyId);

let player;
let playerReady = false;
let currentVideoId = null;
let hasUserStarted = false;

/* YOUTUBE PLAYER */
function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    width: "100%",
    height: "100%",
    playerVars: {
      controls: 1,
      rel: 0,
      modestbranding: 1
    },
    events: {
      onReady: () => playerReady = true,
      onStateChange: onPlayerStateChange
    }
  });
}

function playVideo(videoId) {
  if (!playerReady) return;
  if (videoId === currentVideoId) return;

  currentVideoId = videoId;
  player.loadVideoById(videoId);

  if (hasUserStarted) {
    player.playVideo();
  } else {
    player.pauseVideo();
  }
}

function onPlayerStateChange(e) {
  if (e.data === YT.PlayerState.PLAYING) hasUserStarted = true;
  if (e.data === YT.PlayerState.ENDED) nextSong();
}

/* BOTÃO INICIAR */
document.getElementById("startBtn").onclick = () => {
  hasUserStarted = true;
  player.playVideo();
  document.getElementById("startOverlay").style.display = "none";
};

/* FILA */
socket.on("queueUpdate", queue => {
  const container = document.getElementById("queue");
  container.innerHTML = "";

  if (queue.length > 0) {
    playVideo(queue[0].videoId);
    document.getElementById("nowTitle").innerText = queue[0].title;
    document.getElementById("nowSinger").innerText = "🎤 " + queue[0].singer;
  } else {
    document.getElementById("nowTitle").innerText = "Aguardando música…";
    document.getElementById("nowSinger").innerText = "";
  }

  queue.forEach((q, i) => {
    const item = document.createElement("div");
    item.className = "queue-item";

    const thumb = document.createElement("div");
    thumb.className = "queue-thumb";
    thumb.style.backgroundImage = q.thumbnail
    ? `url(${q.thumbnail})`
    : "url('https://i.imgur.com/8Km9tLL.png')";


    const info = document.createElement("div");
    info.className = "queue-info";
    info.innerHTML = `
      <strong>${i + 1}. ${q.title}</strong>
      <small>🎤 ${q.singer}</small>
    `;

    item.appendChild(thumb);
    item.appendChild(info);
    container.appendChild(item);
  });
});

function nextSong() {
  socket.emit("nextSong", partyId);
}
</script>

</body>
</html>
