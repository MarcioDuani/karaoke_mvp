<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Karaokê – Duani Art'S</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
/* ===== SEU CSS (MANTIDO) ===== */
body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 28px;
}

.main {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
  padding: 20px;
}

.player-card, .queue-card {
  background: #1c1c1c;
  border-radius: 16px;
  padding: 16px;
}

.queue-card {
  display: flex;
  flex-direction: column;
}

#player {
  width: 100%;
  height: 420px;
}

.now-playing {
  text-align: center;
}

.queue-list {
  height: 420px;
  overflow-y: auto;
  padding-right: 6px;
  margin-top: 12px;
}

.queue-item {
  display: flex;
  gap: 12px;
  padding: 10px;
  border-bottom: 1px solid #333;
}

.queue-thumb {
  width: 120px;
  height: 68px;
  background-size: cover;
  background-position: center;
  border-radius: 8px;
}

.controls {
  margin-top: 16px;
  display: flex;
  justify-content: center;
}

.controls button {
  background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
  color: #fff;
  border: 1px solid #333;
  padding: 14px 28px;
  font-size: 16px;
  border-radius: 14px;
  cursor: pointer;
}

.score-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.score-overlay.hidden {
  display: none;
}

.score-box {
  background: #151515;
  padding: 40px 60px;
  border-radius: 20px;
  text-align: center;
}

#scoreValue {
  font-size: 96px;
  font-weight: bold;
}

#startOverlay {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.6);
  z-index: 5;
}

#startBtn {
  font-size: 32px;
  padding: 18px 42px;
  border-radius: 50px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<header>🎤 Karaokê – Duani Art'S</header>

<div class="main">

  <div class="player-card" style="position: relative;">
    <div id="startOverlay">
      <button id="startBtn">▶ Iniciar Festa</button>
    </div>

    <div id="player"></div>

    <div class="now-playing">
      <h2 id="nowTitle">Aguardando música…</h2>
      <p id="nowSinger"></p>
    </div>
  </div>

  <div class="queue-card">
    <h3>🎵 Fila</h3>
    <div class="queue-list" id="queue"></div>
    <div class="controls">
      <button onclick="nextSong()">⏭ Próxima</button>
    </div>
  </div>

</div>

<!-- SCORE -->
<div id="scoreOverlay" class="score-overlay hidden">
  <div class="score-box">
    <h2 id="scoreMessage"></h2>
    <div id="scoreValue">0</div>
  </div>
</div>

<audio id="drumSound" preload="auto"
  src="https://cdn.pixabay.com/audio/2022/03/15/audio_6b7a4c7c78.mp3">
</audio>

<script>
/* =========================
   STATE
========================= */
let partyStarted = false;
let isScoring = false;

/* =========================
   SOCKET
========================= */
const socket = io();
const partyId = new URLSearchParams(location.search).get("party");
socket.emit("joinParty", partyId);

/* =========================
   PLAYER
========================= */
let player;
let playerReady = false;
let currentVideoId = null;

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    events: {
      onReady: () => playerReady = true,
      onStateChange: onPlayerStateChange
    }
  });
}

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.ENDED) {
    if (!isScoring && partyStarted) startScoringFlow();
  }
}

/* =========================
   VIDEO CONTROL
========================= */
function playVideo(videoId) {
  if (!playerReady || videoId === currentVideoId) return;

  currentVideoId = videoId;
  hideScore();

  if (!partyStarted) {
    // ❄️ apenas prepara o vídeo (NUNCA toca)
    player.cueVideoById(videoId);
  } else {
    // ▶️ festa iniciada → toca normal
    player.loadVideoById(videoId);
    setTimeout(() => player.playVideo(), 300);
  }
}


/* =========================
   SCORE FLOW
========================= */
function startScoringFlow() {
  isScoring = true;
  player.pauseVideo();

  showScoreAnimated(() => {
    setTimeout(() => {
      hideScore();
      isScoring = false;
      nextSong();
    }, 1800); // ⏱ tempo leitura (reduzido)
  });
}

function showScoreAnimated(onFinish) {
  const overlay = document.getElementById("scoreOverlay");
  const value = document.getElementById("scoreValue");
  const msg = document.getElementById("scoreMessage");
  const drum = document.getElementById("drumSound");

  overlay.classList.remove("hidden");
  value.innerText = "0";
  msg.innerText = "";

  const finalScore = Math.floor(Math.random() * 101);

  const TOTAL_TIME = 8200; // ⏱ duração total da rolagem (ms)
  const FRAME_TIME = 20;   // ⏱ fluidez
  const STEPS = TOTAL_TIME / FRAME_TIME;

  let step = 0;

  drum.currentTime = 0;
  drum.loop = true;
  drum.play();

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  const timer = setInterval(() => {
    step++;
    const progress = step / STEPS;           // 0 → 1
    const eased = easeOutCubic(progress);    // easing
    const current = Math.round(eased * finalScore);

    value.innerText = current;

    if (step >= STEPS) {
      clearInterval(timer);
      drum.pause();
      value.innerText = finalScore;
      showFinalMessage(finalScore);
      if (onFinish) onFinish();
    }
  }, FRAME_TIME);
}



function showFinalMessage(score) {
  const msg = document.getElementById("scoreMessage");

  if (score >= 80) msg.innerText = "🎉 Você deu um show!";
  else if (score >= 50) msg.innerText = "💪 Mandou bem!";
  else msg.innerText = "😅 Bora treinar mais!";
}

function hideScore() {
  document.getElementById("scoreOverlay").classList.add("hidden");
}

/* =========================
   UI / QUEUE
========================= */
document.getElementById("startBtn").onclick = () => {
  partyStarted = true;
  document.getElementById("startOverlay").style.display = "none";

  // ▶️ TOCA O PRIMEIRO VÍDEO SE JÁ EXISTIR
  if (currentVideoId) {
    player.playVideo();
  }
};

socket.on("queueUpdate", queue => {
  const q = document.getElementById("queue");
  q.innerHTML = "";

  if (queue.length) {
    playVideo(queue[0].videoId);
    nowTitle.innerText = queue[0].title;
    nowSinger.innerText = "🎤 " + queue[0].singer;
  }

  queue.forEach((s, i) => {
    const item = document.createElement("div");
    item.className = "queue-item";

    const t = document.createElement("div");
    t.className = "queue-thumb";
    t.style.backgroundImage = `url(${s.thumbnail})`;

    const info = document.createElement("div");
    info.innerHTML = `<strong>${i+1}. ${s.title}</strong><br><small>${s.singer}</small>`;

    item.appendChild(t);
    item.appendChild(info);
    q.appendChild(item);
  });
});

function nextSong() {
  socket.emit("nextSong", partyId);
}
</script>

</body>
</html>
