<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Karaokê - Admin</title>

  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
document.addEventListener("click", () => {
  if (player && player.isMuted && player.isMuted()) {
    player.unMute();
  }
}, { once: true });
</script>


  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #player-container {
      width: 80%;
      height: 450px;
      margin: 20px auto;
      background: #000;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    ul {
      list-style: none;
      padding: 0;
      width: 80%;
      margin: auto;
      text-align: left;
    }

    li {
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    button {
      margin: 15px;
      padding: 14px 26px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🎤 Karaokê – Admin</h1>

<div id="player-container">
  <div id="player"></div>
</div>

<div>
  <button onclick="enableSound()">🔊 Ativar som</button>
  <button onclick="nextSong()">⏭ Próxima música</button>
</div>

<h2>🎵 Fila</h2>
<ul id="queue"></ul>

<script>
  // =========================
  // SOCKET.IO
  // =========================
  const socket = io();
  const partyId = new URLSearchParams(window.location.search).get("party");

  if (!partyId) {
    alert("Festa não informada");
    throw new Error("partyId ausente");
  }

  socket.emit("joinParty", partyId);

  // =========================
  // ESTADO
  // =========================
  let player;
  let playerReady = false;
  let currentVideoId = null;

  // =========================
  // YOUTUBE PLAYER
  // =========================
  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      width: "100%",
      height: "100%",
      playerVars: {
        controls: 1,
        rel: 0,
        modestbranding: 1,
        playsinline: 1,
        enablejsapi: 1,
        origin: window.location.origin
      },
      events: {
        onReady: () => {
          playerReady = true;
        },
        onStateChange: onPlayerStateChange
      }
    });
  }

  function playVideo(videoId) {
    if (!playerReady) return;
    if (!videoId) return;
    if (currentVideoId === videoId) return;

    currentVideoId = videoId;

    // carrega MUTADO (obrigatório para autoplay)
    player.loadVideoById(videoId);
    player.mute();

    // tenta tocar após pequeno delay
    setTimeout(() => {
      player.playVideo();
    }, 300);
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED) {
      nextSong();
    }
  }

  function enableSound() {
    if (player && player.isMuted()) {
      player.unMute();
    }
  }

  // =========================
  // FILA
  // =========================
  socket.on("queueUpdate", queue => {
    const list = document.getElementById("queue");
    list.innerHTML = "";

    if (queue.length > 0) {
      playVideo(queue[0].videoId);
    }

    queue.forEach((item, index) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <strong>${index + 1}.</strong> ${item.title || "Sem título"}
        <br>🎤 <em>${item.singer || "Desconhecido"}</em>
      `;
      list.appendChild(li);
    });
  });

  function nextSong() {
    socket.emit("nextSong", partyId);
  }
</script>

</body>
</html>
