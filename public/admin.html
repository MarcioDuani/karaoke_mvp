<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Karaokê – Duani Art'S</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 28px;
}

.main {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
  padding: 20px;
}

.player-card, .queue-card {
  background: #1c1c1c;
  border-radius: 16px;
  padding: 16px;
}

#player {
  width: 100%;
  height: 420px;
}

.now-playing {
  text-align: center;
}

.queue-list {
  max-height: 600px;
  overflow-y: auto;
}

.queue-item {
  display: flex;
  gap: 12px;
  padding: 10px;
  border-bottom: 1px solid #333;
}

.queue-thumb {
  width: 120px;
  height: 68px;
  background-size: cover;
  background-position: center;
  border-radius: 8px;
}

.controls {
  text-align: center;
  margin-top: 10px;
}

button {
  padding: 14px 26px;
  font-size: 16px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  background: #ff0055;
  color: white;
}

/* SCORE */
.score-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.score-overlay.hidden {
  display: none;
}

.score-box {
  background: #151515;
  padding: 40px 60px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 0 25px rgba(255,0,85,0.4);
}

#scoreValue {
  font-size: 96px;
  font-weight: bold;
}

#startBtn {
  font-size: 32px;
  padding: 18px 42px;
  border-radius: 50px;
  border: none;
  cursor: pointer;
  background: var(--accent);
  color: white;
}
#startOverlay {
  position: absolute;
  inset: 0; /* cobre todo o player */
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.6);
  z-index: 5;
}
#startBtn:hover {
  transform: scale(1.05);
}


</style>
</head>

<body>

<header>🎤 Karaokê – Duani Art'S</header>

<div class="main">

  <div class="player-card" style="position: relative;">
    <div id="startOverlay">
      <button id="startBtn">▶ Iniciar Festa</button>
    </div>

    <div id="player"></div>

    <div class="now-playing">
      <h2 id="nowTitle">Aguardando música…</h2>
      <p id="nowSinger"></p>
    </div>
  </div>

  <div class="queue-card">
    <h3>🎵 Fila</h3>
    <div class="queue-list" id="queue"></div>
    <div class="controls">
      <button onclick="nextSong()">⏭ Próxima</button>
    </div>
  </div>

</div>

<!-- SCORE OVERLAY -->
<div id="scoreOverlay" class="score-overlay hidden">
  <div class="score-box">
    <h2 id="scoreMessage"></h2>
    <div id="scoreValue">0</div>
  </div>
</div>

<audio id="drumSound" preload="auto"
  src="https://cdn.pixabay.com/audio/2022/03/15/audio_6b7a4c7c78.mp3">
</audio>

<script>
/* SCORE STATE */
let scoreShown = false;
let scoreWatcher = null;

function resetScoreState() {
  scoreShown = false;
  if (scoreWatcher) {
    clearInterval(scoreWatcher);
    scoreWatcher = null;
  }
}

function showScore() {
  const overlay = document.getElementById("scoreOverlay");
  const value = document.getElementById("scoreValue");
  const msg = document.getElementById("scoreMessage");
  const drum = document.getElementById("drumSound");

  overlay.classList.remove("hidden");

  const finalScore = Math.floor(Math.random() * 101);
  let current = 0;
  let delay = 40;

  drum.currentTime = 0;
  drum.loop = true;
  drum.play();

  if (finalScore >= 80) msg.innerText = "🎉 Parabéns!";
  else if (finalScore >= 50) msg.innerText = "💪 Muito bom!";
  else msg.innerText = "😅 Precisa melhorar";

  function roll() {
    current++;
    value.innerText = current;
    delay += 8;

    if (current < finalScore) {
      setTimeout(roll, delay);
    } else {
      drum.pause();
    }
  }

  roll();
}

/* SOCKET / PLAYER */
const socket = io();
const partyId = new URLSearchParams(location.search).get("party");
socket.emit("joinParty", partyId);

let player;
let playerReady = false;
let currentVideoId = null;
let hasUserStarted = false;

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    events: {
      onReady: () => playerReady = true,
      onStateChange: onPlayerStateChange
    }
  });
}

function playVideo(videoId) {
  if (!playerReady || videoId === currentVideoId) return;
  currentVideoId = videoId;
  player.loadVideoById(videoId);
  hasUserStarted ? player.playVideo() : player.pauseVideo();
}

function startScoreWatcher() {
  scoreWatcher = setInterval(() => {
    const d = player.getDuration();
    const c = player.getCurrentTime();
    if (!scoreShown && d && d - c <= 5) {
      scoreShown = true;
      showScore();
    }
  }, 500);
}

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.PLAYING) {
    resetScoreState();
    startScoreWatcher();
  }

  if (event.data === YT.PlayerState.ENDED) {
    setTimeout(() => {
      document.getElementById("scoreOverlay").classList.add("hidden");
      nextSong();
    }, 4000);
  }
}

document.getElementById("startBtn").onclick = () => {
  hasUserStarted = true;
  player.playVideo();
  document.getElementById("startOverlay").style.display = "none";
};

socket.on("queueUpdate", queue => {
  const q = document.getElementById("queue");
  q.innerHTML = "";

  if (queue.length) {
    playVideo(queue[0].videoId);
    nowTitle.innerText = queue[0].title;
    nowSinger.innerText = "🎤 " + queue[0].singer;
  }

  queue.forEach((s, i) => {
    const item = document.createElement("div");
    item.className = "queue-item";

    const t = document.createElement("div");
    t.className = "queue-thumb";
    t.style.backgroundImage = s.thumbnail
      ? `url(${s.thumbnail})`
      : "url('https://i.imgur.com/8Km9tLL.png')";

    const info = document.createElement("div");
    info.innerHTML = `<strong>${i+1}. ${s.title}</strong><br><small>${s.singer}</small>`;

    item.appendChild(t);
    item.appendChild(info);
    q.appendChild(item);
  });
});

function nextSong() {
  socket.emit("nextSong", partyId);
}
</script>

</body>
</html>
