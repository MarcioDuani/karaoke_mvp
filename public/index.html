<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Karaokê</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

<style>
body {
  background: linear-gradient(135deg, #111, #222);
  font-family: Arial, sans-serif;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.card {
  background: #1c1c1c;
  padding: 40px;
  border-radius: 14px;
  width: 360px;
  text-align: center;
  box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}

input {
  background: #2a2a2a;
  color: #fff;
}

button {
  background: #ff0055;
  color: #fff;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #ff336d;
}

/* QR */
.qr-wrapper {
  background: #ffffff;
  margin-top: 25px;
  padding: 20px;
  border-radius: 14px;
  display: none;

  /* CENTRALIZA TUDO */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.qr-wrapper p {
  color: #000;
  margin-bottom: 12px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">
  <h1>🎤 Bem-vindo ao Karaokê</h1>
  <p>Crie sua festa e comece a cantar</p>

  <input id="partyName" placeholder="Nome da festa">
  <button onclick="createParty()">Criar festa</button>

  <div class="qr-wrapper" id="qrWrapper">
    <p>📱 Escaneie com o celular</p>
    <div id="qrcode"></div>
  </div>
</div>

<script>
const socket = io();
let serverIP = "localhost";

// pergunta ao servidor qual é o IP real
fetch("/api/server-ip")
  .then(res => res.json())
  .then(data => serverIP = data.ip);

function createParty() {
  const name = document.getElementById("partyName").value.trim();
  if (!name) return;
  socket.emit("createParty", name);
}

socket.on("partyCreated", party => {
  // salva a festa no host
  localStorage.setItem("lastPartyId", party.id);

  // gera QR normalmente
  const url = `http://${serverIP}:3000/join.html?party=${party.id}`;

  const qrBox = document.getElementById("qrWrapper");
  const qr = document.getElementById("qrcode");

  qr.innerHTML = "";
  qrBox.style.display = "flex";

  new QRCode(qr, {
    text: url,
    width: 220,
    height: 220,
    colorDark: "#000",
    colorLight: "#fff",
    correctLevel: QRCode.CorrectLevel.H
  });

  // 🚀 SE FOR O ELECTRON (HOST), REDIRECIONA PARA O ADMIN
  if (window.navigator.userAgent.includes("Electron")) {
  // garante que o host entre na festa antes de ir pro admin
  socket.emit("joinParty", party.id);

  // pequeno delay para evitar race condition
  setTimeout(() => {
    window.location.href = `/admin.html?party=${party.id}`;
  }, 300);
}

});

</script>


</body>
</html>
